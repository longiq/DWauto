name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py

      - name: Zip bundle
        run: Compress-Archive -Path dist/DWauto -DestinationPath DWauto-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DWauto-windows
          path: DWauto-windows.zip
