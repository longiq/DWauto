# Cập nhật 26/08/2026: chuyển từ MuMu Player sang BlueStacks Air 5.21.785 —
# verify lại thấy input tap KHÔNG còn bị khoá như bản 5.21.770 cũ (SPEC.md có
# ghi chi tiết). BlueStacks miễn phí thật, không cần đăng nhập, cổng ADB cố định
# (khác MuMu đổi cổng liên tục). Toàn bộ template cũ dùng lại được nguyên vẹn —
# cùng game, cùng UI asset, cùng tỉ lệ khung hình (0.5625), chỉ khác độ phân giải
# tuyệt đối (1080x1920 so với 900x1600) — verify khớp 0.90-0.98 không cần cắt lại.

capture:
  # adb    = chụp thẳng từ Android. Cửa sổ để ĐÂU, TO NHỎ ra sao cũng chạy, và
  #          không cần quyền Screen Recording trên macOS. (khuyến nghị)
  # screen = chụp màn hình máy, phải khai báo region cố định bên dưới.
  backend: adb

  window_title: BlueStacks   # dò cửa sổ theo tên, để quy đổi toạ độ lúc click
  template_width: 506        # bề ngang ảnh lúc cắt template — ĐỪNG đổi nếu không cắt lại
  adb_host: 127.0.0.1
  adb_port: 5555              # BlueStacks dùng cổng cố định (Settings > Advanced > ADB),
                               # không đổi ngẫu nhiên như MuMu — đặt cứng vẫn ổn định
  # BlueStacks không bundle sẵn adb riêng — dùng bản chuẩn cài qua Homebrew
  # (`brew install android-platform-tools`). Không cần trick "gọi qua adb_binary
  # thay adb_shell" như MuMu nữa — BlueStacks không có bug đó, nhưng vẫn giữ
  # đường này vì subprocess đáng tin cậy hơn thư viện adb_shell nói chung.
  adb_binary: "/opt/homebrew/bin/adb"

  # Chỉ dùng khi backend=screen. Đo lại bằng: python recorder.py --pick-region
  region: [149, 84, 506, 932]

match:
  threshold: 0.85          # điểm khớp thật đo được: 1.00 đúng nút, ≤0.45 nút khác
  thresholds:              # ngưỡng riêng cho nút khó
    # Kính lúp vẽ đè thẳng lên bản đồ, không có nền riêng: chat trong game chạy
    # qua phía sau làm điểm rớt còn ~0.86. Đo được: có nút 0.86-1.00, không có 0.53.
    search_button: 0.75
    # Nút Rally có hiệu ứng xoay liên tục quanh icon — mỗi lần chụp bắt 1 khung
    # animation khác nhau. Đo được thật 21/08/2026: dao động 0.81-0.98 tại đúng
    # nút, ngưỡng mặc định 0.85 thỉnh thoảng cao hơn điểm đo được → đây là
    # nguyên nhân thật của "kẹt ở rally" người dùng báo, không chỉ do rally đầy
    # quân. Hạ ngưỡng xuống dưới đáy dao động đã đo, còn dư biên an toàn.
    rally_button: 0.7

templates:
  search_button: templates/search_button.png    # kính lúp trên world map
  search_confirm: templates/search_confirm.png  # nút Search trong panel Rally
  # Update 21/08/2026: panel Search giờ có 3 tab Jungle/Gather/Rally, phải tự
  # chọn tab Rally (có lúc không mặc định) trước khi bấm Search.
  rally_tab_button: templates/rally_tab_button.png
  rally_button: templates/rally_button.png      # nút Rally tròn trên popup mục tiêu
  march_button: templates/march_button.png      # nút March
  # Hết energy: nút March đổi thành Get Energy (cùng vị trí). Bấm vào mở popup
  # "Get More", nút x20 dùng luôn item "10 Energy" có sẵn, tự đóng popup lại.
  get_energy_button: templates/get_energy_button.png
  energy_x20_button: templates/energy_x20_button.png
  # Rally đã đầy quân (troop tổng của rally vượt giới hạn): March cùng vị trí
  # nhưng hiện màu xám, khoá hẳn — không có gì bù, chỉ bấm Back thoát rally này.
  march_button_disabled: templates/march_button_disabled.png

rally:
  marches_per_round: 3     # 3 lượt liên tiếp cho 3 đội quân
  wait_minutes: 5          # chờ bao lâu trước khi bắt đầu vòng kế — CHỈNH THEO THỜI GIAN RALLY CỦA BẠN

timing:
  step_timeout: 15.0       # chờ tối đa (giây) để tới màn hình kế sau một click.
                           # Cần rộng tay: sau March game chạy animation bay tới điểm tập kết.
  poll_interval: 0.4       # nhịp quét template (backend adb tự tốn ~0.7s mỗi ảnh)
  retries: 2               # số lần click lại nếu click bị nuốt / trượt
  click_delay: [0.35, 0.9] # nghỉ ngẫu nhiên sau mỗi click (giây)

click:
  # adb   = tap qua ADB (dùng lại capture.adb_binary/adb_host) — không cần cửa sổ
  #         hiện/focus, không cần quyền Accessibility. Verify chạy được trên MuMu
  #         Player (16/08/2026); KHÔNG chạy trên BlueStacks Air (input tap bị khoá).
  # mouse = click chuột thật qua pyautogui — cần cửa sổ hiện, không bị che.
  backend: adb
  offset_px: 4             # lệch ngẫu nhiên ±px quanh tâm nút
  move_duration: [0.08, 0.2]
